<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현대캐피탈 AI 어시스턴트</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>

<body>
<div class="app">

  <!-- ── 좌측 내비게이션 ──────────────────────────────────── -->
  <nav class="nav">
    <div class="brand">
      <div class="mark">로고</div>
      <div>
        <div class="name">현대캐피탈 AI 어시스턴트</div>
        <div class="sub">INTERNAL BETA</div>
      </div>
    </div>

    <div class="nav-new-wrap">
      <button class="nav-new" id="btn-new">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        새 대화
      </button>
    </div>

    <div class="nav-label">최근 대화</div>
    <div class="nav-list" id="nav-list"></div>

    <div class="spacer"></div>

    <div class="nav-user">
      <div class="av" id="user-av">?</div>
      <div>
        <div class="u-name" id="user-name">로그인 필요</div>
        <div class="u-org" id="user-org">현대캐피탈</div>
      </div>
    </div>

    <!-- 보안 등급 · 소속 — 서버에서 받지 않고 사용자가 직접 고른다(데모용).
         문서 검색은 「이 등급 이하」 이면서 「아래 노드 경로 아래」 인 문서만 본다. -->
    <label class="nav-level">
      <span>보안 등급</span>
      <select id="level" disabled>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>
    </label>

    <!-- 부서·팀·권한 범위. 선택지는 js/org.js 의 ORG·SCOPES 에서 만들어 넣는다(여기 이름을 적지 않는다). -->
    <label class="nav-level">
      <span>부서</span>
      <select id="dept" disabled></select>
    </label>
    <label class="nav-level">
      <span>팀</span>
      <select id="team" disabled></select>
    </label>
    <label class="nav-level">
      <span>권한 범위</span>
      <select id="scope" disabled></select>
    </label>
    <!-- 위 선택이 만들어 낸 검색 범위. 이 접두어로 시작하는 문서만 검색된다. -->
    <div class="nav-path" id="scope-path">로그인 필요</div>
  </nav>

  <!-- ── 본문 ─────────────────────────────────────────────── -->
  <div class="main">

    <header class="head">
      <div class="head-left">
        <h1 id="title">새 대화</h1>
        <span class="badge"><i></i><span id="badge">에이전트 미선택</span></span>
      </div>
      <div class="head-actions">
        <button class="btn-ghost" id="btn-reset">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></svg>
          처음부터
        </button>
        <button class="btn-ghost" id="btn-key">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8 3 3-3 3-2-2-2 2"/></svg>
          연결 설정
        </button>
        <button class="btn-ghost" id="btn-verify">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>
          검증
        </button>
      </div>
    </header>

    <!-- 대화 내용은 js/messages.js · js/hitl.js 가 채운다 -->
    <div class="feed scroll" id="feed"><div class="feed-inner" id="feed-inner"></div></div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="box">
          <textarea id="input" rows="1" placeholder="무엇이든 물어보세요"></textarea>
          <button class="send" id="btn-send" title="보내기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="foot" id="foot">AI 가 생성한 답변입니다. 중요한 의사결정 전에는 원문과 데이터를 확인해 주세요.</div>
      </div>
    </div>

  </div>
</div>

<!-- ── 로그인 ───────────────────────────────────────────────
     <dialog> 의 showModal() 은 배경 클릭 차단·포커스 가둠·Esc 처리를 브라우저가 해 준다.
     Esc 로 닫히면 안 되므로 cancel 이벤트를 js/app.js 에서 막는다. -->
<dialog class="login" id="login">
  <form id="login-form">
    <div class="login-brand">현대캐피탈 AI 어시스턴트</div>
    <p class="login-desc">발급받은 테스트 계정으로 로그인합니다. 보안 등급은 로그인 후 좌측 하단에서 직접 고릅니다.</p>

    <label class="login-field">
      <span>아이디</span>
      <input id="login-id" type="text" autocomplete="username" autofocus required>
    </label>
    <label class="login-field">
      <span>비밀번호</span>
      <input id="login-pw" type="password" autocomplete="current-password" required>
    </label>

    <p class="login-error" id="login-error" hidden></p>
    <button class="btn-primary" id="login-submit" type="submit">로그인</button>
  </form>
</dialog>

<!-- ── 연결 설정 (모델 서빙 ID · 인증 토큰) ───────────────────
     로그인과 달리 Esc 로 닫혀도 된다 — 관문이 아니라 선택 설정이다.
     두 값 모두 비워 두면 프록시(api/chat.js)의 서버 기본값을 쓴다. -->
<dialog class="login" id="settings">
  <form id="settings-form">
    <div class="login-brand">연결 설정</div>
    <p class="login-desc">이 브라우저에만 저장됩니다. 비워 두면 서버에 설정된 기본값을 사용합니다.</p>

    <label class="login-field">
      <span>모델 서빙 ID</span>
      <input id="settings-serving" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="예: 688" autofocus>
    </label>
    <label class="login-field">
      <span>인증 토큰</span>
      <input id="settings-key" type="password" autocomplete="off" placeholder="비워 두면 서버 키 사용">
    </label>

    <button class="btn-primary" type="submit">저장</button>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
